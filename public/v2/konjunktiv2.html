<!doctype html>
<html lang="ru"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><title>DrillCards · Konjunktiv II</title>
  <link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="./card-ui.css">
  <link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#2563eb"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head><body><main class="dc-demo dc-k2">
  <header><strong><a class="dc-brand" href="./today.html">DrillCards</a> · <a href="./session.html"><span id="title">Konjunktiv II</span></a></strong>
    <label><span id="languageLabel">Язык интерфейса</span> <select id="language"><option value="ru">RU</option><option value="en">EN</option><option value="de">DE</option></select></label>
  </header>
  <nav class="dc-k2-filters">
    <label><span id="trainerLabel">Тренажёр</span> <select id="trainer"></select></label>
    <fieldset class="dc-k2-modes"><legend id="modeLabel">Режим</legend>
      <label><input type="radio" name="mode" value="text"> <span id="modeText">Ввод</span></label>
      <label><input type="radio" name="mode" value="tokens"> <span id="modeTokens">Слова</span></label>
    </fieldset>
  </nav>
  <p id="meta" class="dc-sentence-meta"></p>
  <div id="card"></div>
  <div class="dc-session-actions">
    <button id="tryAgain" type="button" hidden></button>
    <button id="previous" type="button"></button><button id="retrySave" type="button" hidden></button>
  </div>
  <div id="extra" class="dc-sentence-extra"></div>
  <div id="stats" class="dc-sentence-stats"></div>
  <label class="dc-sentence-speak"><input id="autoSpeak" type="checkbox"> <span id="autoSpeakLabel"></span></label>
  <p id="keyboard" class="dc-sentence-keys"></p>
  <p id="notice" class="dc-session-notice" role="status" aria-live="polite"></p>
</main><script type="module">await import("../retire-v1.js"); await import("./families/konjunktiv2/konjunktiv2-page.js");</script></body></html>
