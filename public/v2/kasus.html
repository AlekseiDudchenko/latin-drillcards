<!doctype html>
<html lang="ru"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><title>DrillCards · Аккузатив или датив?</title>
  <link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="./card-ui.css">
  <link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#2563eb"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <style>
    .dc-kasus form#setupForm { display:flex; flex-wrap:wrap; gap:12px; align-items:end; margin:16px 0; }
    .dc-kasus-filters { border:0; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:4px 12px; min-width:0; flex:1 1 260px; }
    .dc-kasus-filters legend { padding:0; margin-bottom:6px; }
    .dc-kasus-filters label { display:flex; gap:6px; align-items:center; min-height:44px; padding-right:4px; }
    :is(.dc-kasus-setup, .dc-session-actions, .dc-kasus-after) button { font:inherit; padding:10px 14px; min-height:44px; border:1px solid #8c9ab2; border-radius:8px; background:transparent; color:inherit; cursor:pointer; }
    :is(.dc-kasus-setup, .dc-session-actions) button:disabled { opacity:.5; cursor:default; }
    .dc-kasus #start { background:#234cca; color:white; border-color:#234cca; }
    .dc-kasus .dc-prompt { font-size:clamp(1.3rem,5vw,1.8rem); }
    .dc-kasus .dc-choices { grid-template-columns:repeat(auto-fill,minmax(min(100%,132px),1fr)); }
    .dc-kasus-after { margin:12px 0; overflow-wrap:anywhere; display:grid; gap:8px; }
    .dc-kasus-after[hidden] { display:none; }
    .dc-kasus-after p { margin:0; }
    .dc-kasus-translation, .dc-kasus-item-stats, .dc-kasus-keys, .dc-kasus-reviewing { color:#526077; }
    .dc-kasus-reviewing { font-style:italic; }
    .dc-kasus-rule { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
    .dc-kasus-speech { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
    .dc-kasus-keys { font-size:.9rem; }
    .dc-session-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
    .dc-session-actions button { flex:1 1 140px; }
    dialog.dc-rule { padding:0; border:0; border-radius:12px; width:min(640px, calc(100vw - 24px)); max-height:calc(100dvh - 24px); background:#fff; color:#1b2433; }
    dialog.dc-rule::backdrop { background:rgba(15,23,42,.55); }
    .dc-rule-panel { padding:16px 18px; }
    .dc-rule-head { display:flex; gap:12px; align-items:start; justify-content:space-between; }
    .dc-rule-head h2 { margin:0; font-size:1.25rem; }
    .dc-rule-x { font:inherit; font-size:1.5rem; line-height:1; min-width:44px; min-height:44px; border:0; background:transparent; color:inherit; cursor:pointer; }
    .dc-rule-table { overflow-x:auto; margin:12px 0; }
    .dc-rule-table table { border-collapse:collapse; width:100%; font-size:.95rem; }
    .dc-rule-table :is(th, td) { border:1px solid #c7d0de; padding:6px 8px; text-align:left; }
    .dc-rule-table thead th { background:#eef2f8; }
    .dc-rule-table tr.dc-rule-hit :is(th, td) { background:#fff1b8; font-weight:600; }
    .dc-rule-examples { padding-left:20px; display:grid; gap:6px; }
    .dc-rule-examples li span { display:block; }
    .dc-rule-tr { color:#526077; font-size:.95rem; }
    .dc-rule-foot { display:flex; justify-content:end; }
    .dc-rule-foot button { font:inherit; padding:10px 16px; min-height:44px; border:1px solid #234cca; border-radius:8px; background:#234cca; color:white; cursor:pointer; }
  </style>
</head><body><main class="dc-demo dc-kasus">
  <header><strong><a class="dc-brand" href="./today.html">DrillCards</a> · <a id="homeLink" href="./session.html"><span id="title">Аккузатив или датив?</span></a></strong>
    <label><span id="languageLabel">Язык интерфейса</span> <select id="language"><option value="ru">RU</option><option value="en">EN</option><option value="de">DE</option></select></label>
  </header>
  <section id="continue" class="dc-continue" aria-labelledby="continueTitle" hidden>
    <h2 id="continueTitle"></h2><p id="continueLine"></p>
    <div class="dc-session-actions"><button id="continueAction" type="button"></button><button id="continueFinish" type="button"></button></div>
  </section>

  <section id="setup" class="dc-kasus-setup" hidden>
    <form id="setupForm">
      <fieldset class="dc-kasus-filters"><legend id="filterLabel"></legend>
        <label><input type="radio" name="filter" value="all"> <span id="filter-all"></span></label>
        <label><input type="radio" name="filter" value="article"> <span id="filter-article"></span></label>
        <label><input type="radio" name="filter" value="case"> <span id="filter-case"></span></label>
        <label><input type="radio" name="filter" value="question"> <span id="filter-question"></span></label>
      </fieldset>
      <button id="start" type="submit"></button>
      <p id="empty" class="dc-empty" hidden></p>
    </form>
    <section id="stats" aria-labelledby="statsTitle"><h2 id="statsTitle"></h2><ul id="statsList"></ul></section>
  </section>

  <section id="session" class="dc-session" hidden>
    <p id="progress" class="dc-session-progress" aria-live="polite"></p>
    <p id="reviewing" class="dc-kasus-reviewing" hidden></p>
    <div id="card"></div>
    <div id="after" class="dc-kasus-after" hidden>
      <section id="explanation" aria-labelledby="explanationTitle"><h3 id="explanationTitle"></h3><p id="explanationText"></p></section>
      <p class="dc-kasus-translation"><span id="translationLabel"></span>: <span id="translationText"></span></p>
      <p class="dc-kasus-rule"><span id="ruleSummary"></span> <button id="ruleOpen" type="button" aria-haspopup="dialog" aria-controls="rule"></button></p>
      <div class="dc-kasus-speech"><button id="listen" type="button"></button></div>
      <p id="speechStatus" class="dc-speech-warning" role="status" aria-live="polite"></p>
      <p id="itemStats" class="dc-kasus-item-stats"></p>
    </div>
    <section id="summary" class="dc-session-summary" aria-labelledby="summaryTitle" hidden></section>
    <div class="dc-session-actions">
      <button id="previous" type="button" hidden></button><button id="forward" type="button" hidden></button>
      <button id="retry" type="button" hidden></button>
      <button id="pause" type="button" hidden></button><button id="resume" type="button" hidden></button>
      <button id="finish" type="button" hidden></button><button id="new" type="button" hidden></button>
    </div>
    <p id="keyboard" class="dc-kasus-keys" hidden></p>
  </section>
  <dialog id="rule" class="dc-rule"></dialog>
  <p id="notice" class="dc-session-notice" role="status" aria-live="polite"></p>
</main><script type="module">await import("../retire-v1.js"); await import("./families/kasus/kasus-page.js");</script></body></html>
