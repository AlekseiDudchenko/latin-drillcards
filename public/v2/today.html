<!doctype html>
<html lang="ru"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><title>Latin DrillCards · Сегодня</title>
  <link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="./card-ui.css">
  <link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#2563eb"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head><body><main class="dc-demo dc-today">
  <header><strong><a class="dc-brand" href="./today.html">Latin DrillCards</a> · <span id="title">Сегодня</span></strong>
    <label><span id="languageLabel">Язык интерфейса</span> <select id="language"><option value="ru">RU</option><option value="en">EN</option><option value="de">DE</option></select></label>
  </header>
  <div class="dc-today-stats">
    <section id="goal" class="dc-stat" aria-labelledby="goalLabel">
      <h2 id="goalLabel"></h2>
      <p class="dc-stat-value"><strong id="goalValue"></strong> <span id="goalOf"></span></p>
      <div id="goalMeter" class="dc-today-meter" role="progressbar" aria-labelledby="goalLabel" aria-valuemin="0"><span></span></div>
      <p id="goalNote" class="dc-note"></p>
    </section>
    <section id="streak" class="dc-stat" aria-labelledby="streakLabel">
      <h2 id="streakLabel"></h2>
      <p class="dc-stat-value"><strong id="streakValue"></strong></p>
      <p id="streakNote" class="dc-note"></p>
    </section>
  </div>
  <section id="continue" class="dc-continue" aria-labelledby="continueTitle" hidden>
    <h2 id="continueTitle"></h2><p id="continueLine"></p>
    <div class="dc-session-actions"><a id="continueAction" class="dc-action" href="./session.html#session"></a><button id="continueFinish" type="button"></button></div>
  </section>
  <div class="dc-today-actions">
    <section id="due" class="dc-stat" aria-labelledby="dueLabel">
      <h2 id="dueLabel"></h2><p class="dc-stat-value"><strong id="dueValue"></strong></p><p id="dueNote" class="dc-note"></p>
      <a id="dueAction" class="dc-action" href="./session.html" hidden></a>
    </section>
    <section id="fresh" class="dc-stat" aria-labelledby="freshLabel">
      <h2 id="freshLabel"></h2><p class="dc-stat-value"><strong id="freshValue"></strong></p><p id="freshNote" class="dc-note"></p>
      <a id="freshAction" class="dc-action dc-action-primary" href="./session.html" hidden></a>
    </section>
  </div>
  <section aria-labelledby="practiceLabel"><h2 id="practiceLabel" class="dc-today-heading"></h2><ul id="practiceLinks" class="dc-today-links"></ul></section>
  <section aria-labelledby="decksLabel"><h2 id="decksLabel" class="dc-today-heading"></h2><ul id="decks" class="dc-deck-list"></ul></section>
  <p id="notice" class="dc-session-notice" role="status" aria-live="polite"></p>
</main><script type="module">await import("./today-page.js");</script></body></html>
