<!doctype html>
<html lang="ru"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><title>DrillCards · Тест уровня</title>
  <link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="./card-ui.css">
  <link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#2563eb"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <style>
    .dc-level-test :is(.dc-session-actions, .dc-level-intro) button, .dc-level-test select, .dc-level-start { font:inherit; padding:10px 14px; min-height:44px; border:1px solid #8c9ab2; border-radius:8px; background:transparent; color:inherit; cursor:pointer; }
    .dc-level-start { display:inline-flex; align-items:center; text-decoration:none; }
        .dc-level-blocks { list-style:none; padding:0; margin:16px 0; display:grid; gap:10px; }
    .dc-level-block { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; }
    .dc-level-block progress { width:100%; height:12px; }
    .dc-level-badge { font-weight:600; min-width:2.5em; }
    .dc-level-result { font-size:2rem; font-weight:700; margin:8px 0; }
    .dc-level-keys, .dc-level-note { color:var(--dc-muted, #667085); font-size:.9rem; }
  </style>
</head><body><main class="dc-demo dc-level-test">
  <header><strong><a class="dc-brand" href="./today.html">DrillCards</a> · <span id="title">Тест уровня</span></strong>
    <label><span id="languageLabel">Язык интерфейса</span> <select id="language"><option value="ru">RU</option><option value="en">EN</option><option value="de">DE</option></select></label>
    <label><span id="translationLabel">Язык перевода</span> <select id="translation"><option value="ru">RU</option><option value="en">EN</option></select></label>
  </header>
  <section id="intro" class="dc-level-intro" hidden>
    <p id="intro-text"></p>
    <button id="start" type="button"></button>
    <p id="lastResult" class="dc-level-note"></p>
    <p id="notProgress" class="dc-level-note"></p>
  </section>
  <section id="test" class="dc-session" hidden>
    <p id="progress" class="dc-session-progress" aria-live="polite"></p>
    <div id="card"></div>
    <div class="dc-session-actions">
      <button id="retrySave" type="button" hidden></button>
      <button id="stop" type="button"></button>
    </div>
    <p id="keyboard" class="dc-level-keys"></p>
  </section>
  <section id="result" class="dc-session-summary" aria-labelledby="resultTitle" hidden>
    <h2 id="resultTitle"></h2>
    <p id="resultLevel" class="dc-level-result"></p>
    <p id="resultNote" class="dc-level-note"></p>
    <ul id="resultBlocks" class="dc-level-blocks"></ul>
    <div class="dc-session-actions"><a id="startWith" class="dc-level-start" href="./session.html" hidden></a><button id="retake" type="button"></button></div>
  </section>
  <p id="notice" class="dc-session-notice" role="status" aria-live="polite"></p>
</main><script type="module">await import("../retire-v1.js"); await import("./families/level-test/level-test-page.js");</script></body></html>
